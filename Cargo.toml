[package]
name = "ih-muse-macos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A small macOS host-metrics producer for Infinite Haiku"

[dependencies]
anyhow = "1"
reqwest = { version = "=0.12.8", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
ih-muse-client = { path = "../ih-muse/crates/ih-muse-client" }
ih-muse-core = { path = "../ih-muse/crates/ih-muse-core" }
ih-muse-proto = { path = "../ih-muse/crates/ih-muse-proto" }
sysinfo = "0.32"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_with = "=3.11.0"
time = "=0.3.36"
url = "=2.5.2"
